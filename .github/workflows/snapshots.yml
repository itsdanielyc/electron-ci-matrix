# Regenerates the per-OS pixel baselines (and the shared ARIA and geometry
# snapshots) on the runners themselves, then opens a pull request with the
# result. Baselines are never captured on a developer machine: a Windows
# laptop cannot produce a macOS baseline, and runner fonts and GPUs differ.
name: snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browsers
        # Ubuntu's apt can stall on a service-restart prompt during
        # --with-deps (kept non-interactive below) and its mirror can be slow:
        # on ubuntu-26.04 the WebKit packages alone are 140 MB and took over
        # 7 minutes. Each attempt is bounded and the retry waits for apt.
        timeout-minutes: 32
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          bound=""; command -v timeout >/dev/null && bound="timeout 600"   # macOS has no timeout(1)
          for attempt in 1 2; do
            $bound npx playwright install --with-deps chromium && exit 0
            echo "attempt $attempt failed or stalled"
            [ "$attempt" = 2 ] && break
            # A timed-out attempt leaves its apt-get running with the dpkg lock
            # held, so a retry would fail at once. A slow package mirror is the
            # usual cause: let that apt-get finish, then the retry finds the
            # packages in place and only fetches the browsers.
            if command -v apt-get >/dev/null; then
              for i in $(seq 60); do
                pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
                sleep 10
              done
            fi
          done
          exit 1
      - name: Capture baselines
        env:
          CI: "1"
        run: npm run test:ui:update
      - name: Keep only what this runner captured
        # The checkout also holds the other platforms' pixel baselines. Left
        # in the upload, those stale copies would overwrite the fresh ones
        # when the sets are merged. Pixel baselines end in -<platform>.png.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            Windows) platform=win32 ;;
            macOS) platform=darwin ;;
            *) echo "unknown runner OS $RUNNER_OS"; exit 1 ;;
          esac
          find tests/ui/__snapshots__ -type f -name "*.png" ! -name "*-$platform.png" -delete
          find tests/ui/__snapshots__ -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.os }}
          path: tests/ui/__snapshots__
          retention-days: 3

  propose:
    name: open pull request
    needs: [capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: snapshots-*
          path: incoming
      - name: Merge the capture sets
        # Each set holds its own platform's pixel baselines and a copy of the
        # shared ARIA and geometry snapshots; the last set in name order
        # supplies the shared ones. A single set arrives without its folder.
        shell: bash
        run: |
          shopt -s nullglob
          sets=(incoming/snapshots-*/)
          [ ${#sets[@]} -gt 0 ] || sets=(incoming/)
          mkdir -p tests/ui/__snapshots__
          for d in "${sets[@]}"; do cp -R "$d". tests/ui/__snapshots__/; done
          git status --short tests/ui/__snapshots__
      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/ui/__snapshots__
          if git diff --cached --quiet; then echo "No snapshot changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual snapshots from run ${{ github.run_id }}"
          if [ "${{ github.ref_name }}" != "main" ]; then
            # Dispatched on a working branch: land the baselines on that branch,
            # so the pull request that is already open picks them up.
            git push origin "HEAD:${{ github.ref_name }}"
          else
            branch="snapshots/update-${{ github.run_id }}"
            git checkout -b "$branch"
            git push origin "$branch"
            gh pr create --base main --head "$branch"               --title "Update visual snapshots (run ${{ github.run_id }})"               --body "Baselines captured on ubuntu-latest, windows-latest and macos-latest by the snapshots workflow. Review the images before merging."
          fi
